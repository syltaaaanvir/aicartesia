
<!doctype html>
<html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#090d18"><title>Cartesia Voice Studio</title>
<style>
:root{color-scheme:dark;--bg:#090d18;--panel:#121b2b;--line:#293750;--muted:#9aa8bd;--text:#f4f7fb;--accent:#8b7cff}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 20% 0%,#29204b 0,transparent 42%),var(--bg);color:var(--text);font:15px system-ui,sans-serif}main{width:min(740px,100%);margin:auto;padding:26px 15px 45px}.head{display:flex;gap:12px;align-items:center;margin-bottom:20px}.logo{background:linear-gradient(135deg,#8b7cff,#41d6bd);color:#09111d;border-radius:14px;padding:12px;font-weight:900}.sub,.note{color:var(--muted);font-size:12px}h1{font-size:23px;margin:0}h2{font-size:16px;margin:0 0 12px}.panel{background:var(--panel);border:1px solid var(--line);border-radius:17px;padding:17px;margin:13px 0}label{display:block;font-size:13px;margin:12px 0 6px}textarea,input,select{width:100%;background:#0a1220;color:var(--text);border:1px solid #31415c;border-radius:10px;padding:12px;font:inherit}textarea{min-height:145px;line-height:1.7;resize:vertical}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}input[type=range]{padding:0;accent-color:var(--accent)}.val{color:var(--muted);font-size:12px}button{border:0;border-radius:11px;padding:13px;font-weight:750;cursor:pointer}.primary{width:100%;margin-top:16px;background:linear-gradient(100deg,#9b84ff,#62a4ff);color:#080d18}.secondary{background:#26344a;color:white;flex:1}.actions{display:flex;gap:10px;margin-top:10px}.status{font-size:12px;color:var(--muted);margin-top:12px;overflow-wrap:anywhere}.error{color:#ff9c9c}.ok{color:#7ee6c8}audio{width:100%;margin-top:10px}.hidden{display:none}@media(max-width:520px){.grid{grid-template-columns:1fr}main{padding:18px 12px}}
</style></head><body><main>
<header class="head"><div class="logo">音</div><div><h1>Cartesia Voice Studio</h1><div class="sub">Text to Speech · Emotion · Voice controls</div></div></header>
<section class="panel"><h2>১. তোমার লেখা</h2><textarea id="text" maxlength="5000">কখনোই জানবে না... একটা ছোট ভুলের জন্য সারাজীবনের জন্য হারিয়ে গেলে। কি অপরাধ করেছিলাম যার জন্য ক্ষমা টা করতে পারলা না?</textarea><div class="note">সর্বোচ্চ ৫,০০০ অক্ষর। স্বাভাবিক বিরতির জন্য punctuation ব্যবহার করো।</div></section>
<section class="panel"><h2>২. Voice settings</h2><label>Cartesia Voice ID</label><input id="voice" placeholder="তোমার Cartesia Voice ID"><div class="note">Cartesia Playground থেকে Voice ID নাও। API key এখানে দেবে না।</div>
<div class="grid"><div><label>Emotion</label><select id="emotion"><option value="neutral">Neutral</option><option value="sad" selected>Sad</option><option value="angry">Angry</option><option value="excited">Excited</option><option value="content">Content</option><option value="scared">Scared</option><option value="curious">Curious</option><option value="soothing">Soothing</option><option value="calm">Calm</option><option value="surprised">Surprised</option><option value="whisper">Whisper</option></select></div>
<div><label>Speed: <span id="sv" class="val">0.90×</span></label><input id="speed" type="range" min=".6" max="1.5" step=".05" value=".9"></div><div><label>Volume: <span id="vv" class="val">1.00×</span></label><input id="volume" type="range" min=".5" max="2" step=".05" value="1"></div></div>
<button class="primary" id="go">✦ Generate Voice</button><div id="status" class="status"></div></section>
<section class="panel hidden" id="out"><h2>৩. Generated audio</h2><audio id="audio" controls></audio><div class="actions"><button class="secondary" id="download">⬇ Download WAV</button><button class="secondary" id="clear">Clear</button></div></section></main>
<script>
const $=id=>document.getElementById(id);let url=null;
$("speed").oninput=()=> $("sv").textContent=Number($("speed").value).toFixed(2)+"×";
$("volume").oninput=()=> $("vv").textContent=Number($("volume").value).toFixed(2)+"×";
$("go").onclick=async()=>{const status=$("status"),text=$("text").value.trim(),voiceId=$("voice").value.trim();if(!text||!voiceId){status.textContent="Text এবং Voice ID দুটোই দিতে হবে।";status.className="status error";return}
$("go").disabled=true;$("go").textContent="Generating...";status.textContent="Voice তৈরি হচ্ছে...";
try{const r=await fetch("/api/tts",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({transcript:text,voiceId,emotion:$("emotion").value,speed:Number($("speed").value),volume:Number($("volume").value)})});
if(!r.ok){let d={};try{d=await r.json()}catch{}throw Error(d.detail||d.error||"API request failed")}
const blob=await r.blob();if(url)URL.revokeObjectURL(url);url=URL.createObjectURL(blob);$("audio").src=url;$("out").classList.remove("hidden");status.textContent="সফল! Play অথবা Download করো।";status.className="status ok";
}catch(e){status.textContent="সমস্যা: "+e.message;status.className="status error"}finally{$("go").disabled=false;$("go").textContent="✦ Generate Voice"}};
$("download").onclick=()=>{if(!url)return;const a=document.createElement("a");a.href=url;a.download="cartesia-voice.wav";a.click()};
$("clear").onclick=()=>{ $("audio").pause();$("audio").removeAttribute("src");if(url)URL.revokeObjectURL(url);url=null;$("out").classList.add("hidden")};
</script></body></html>
